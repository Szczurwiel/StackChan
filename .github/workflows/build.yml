name: Build StackChan Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest 

    steps:
      - name: Pobieranie kodu
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Obejscie bledu (lokalne pobranie ArduinoJson)
        run: |
          # Tworzymy folder na wlasne komponenty ESP-IDF
          mkdir -p firmware/components
          
          # Pobieramy biblioteke bezposrednio z GitHuba, omijajac uszkodzony menedzer pakietow
          git clone --depth 1 https://github.com/bblanchon/ArduinoJson.git firmware/components/ArduinoJson

      - name: Kompilacja Firmware'u
        run: |
          . /opt/esp/idf/export.sh
          cd firmware 
          
          # Usuwamy plik blokady menedzera pakietow, by nie szukal starych wpisow
          rm -f dependencies.lock
          
          idf.py set-target esp32s3
          idf.py build

      - name: Udostepnienie gotowego pliku
        uses: actions/upload-artifact@v4
        with:
          name: StackChan-CoreS3-Firmware
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
