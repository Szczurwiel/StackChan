name: Build StackChan Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest 

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Przygotowanie niezaleznych komponentow (Brute Force)
        run: |
          mkdir -p firmware/components
          
          # Usuwamy oryginalne (byc moze uszkodzone) wiazania submodules
          rm -rf firmware/components/*
          
          # Pobieramy to, czego szukal CMake i wywalal bledy
          git clone --depth 1 https://github.com/bblanchon/ArduinoJson.git firmware/components/ArduinoJson
          git clone --depth 1 https://github.com/espressif/esp-now.git firmware/components/esp-now
          
          # Tu pojawil sie blad z ostatniej proby - zrodlo autorskiego Mooncake'a 
          git clone https://github.com/m5stack/mooncake.git firmware/components/mooncake
          
          # Pobieramy dodatkowe frameworki UI od twórcow, by uprzedzic nastepny ewentualny blad
          git clone https://github.com/m5stack/smooth_ui_toolkit.git firmware/components/smooth_ui_toolkit

          # Kasowanie lockow
          find . -name "dependencies.lock" -type f -delete

      - name: Kompilacja Firmware'u
        run: |
          . /opt/esp/idf/export.sh
          cd firmware 
          
          idf.py set-target esp32s3
          idf.py build

      - name: Udostepnienie gotowego pliku
        uses: actions/upload-artifact@v4
        with:
          name: StackChan-CoreS3-Firmware
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
