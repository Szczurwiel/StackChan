name: Build StackChan Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Używamy starszej i precyzyjnie dobranej wersji kompilatora - 5.1.2 (zawiera wbudowane esp-now)
    container: espressif/idf:release-v5.1 

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Kompilacja Firmware'u
        run: |
          . /opt/esp/idf/export.sh
          cd firmware 
          
          # Skrypt ustawi urządzenie na esp32s3
          idf.py set-target esp32s3
          
          # Budujemy wszystko
          idf.py build

      - name: Udostepnienie gotowego pliku
        uses: actions/upload-artifact@v4
        with:
          name: StackChan-CoreS3-Firmware
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
