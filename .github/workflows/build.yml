name: Build StackChan ESP-IDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:latest 

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Przygotowanie srodowiska i kompilacja
        run: |
          . /opt/esp/idf/export.sh
          
          cd firmware 
          
          # Tworzymy folder main jesli z jakiegos powodu system operuje gdzies indziej
          mkdir -p main
          
          # Wymuszamy dodanie paczki do manifestu glownego komponentu przed konfiguracja
          cd main
          idf.py add-dependency "bblanchon/ArduinoJson^7.0.4"
          cd ..
          
          # Teraz mozna bezpiecznie ustawic target
          idf.py set-target esp32s3
          
          # Uruchamiamy kompilacje
          idf.py build

      - name: Udostepnienie gotowego pliku
        uses: actions/upload-artifact@v4
        with:
          name: StackChan-CoreS3-Firmware
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/*.bin
            firmware/build/partition_table/*.bin
